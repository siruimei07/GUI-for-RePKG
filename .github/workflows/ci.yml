name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\WallpaperField.slnx --configfile .\NuGet.Config

      - name: Build solution
        shell: pwsh
        run: dotnet build .\WallpaperField.slnx --configuration Release --no-restore

      - name: Enforce first-party warnings
        shell: pwsh
        run: |
          dotnet build .\WallpaperField.csproj --configuration Release --no-restore --no-dependencies -p:EnableNETAnalyzers=true -p:AnalysisMode=Recommended -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\WallpaperField.SmokeTests\WallpaperField.SmokeTests.csproj --configuration Release --no-restore --no-dependencies -p:EnableNETAnalyzers=true -p:AnalysisMode=Recommended -p:TreatWarningsAsErrors=true

      - name: Run and verify SmokeTests
        shell: pwsh
        run: |
          $output = @(& dotnet run --project .\tests\WallpaperField.SmokeTests\WallpaperField.SmokeTests.csproj --configuration Release --no-build --no-restore 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "SmokeTests exited with $exitCode."
          }

          $pattern = '^SMOKE_RESULT tests=([1-9][0-9]*) assertions=([1-9][0-9]*) passed=1 failed=0$'
          $summary = @($output | Where-Object { $_ -match $pattern })
          if ($summary.Count -ne 1) {
            throw "Expected exactly one valid SMOKE_RESULT line; found $($summary.Count)."
          }
          if ($output[-1] -ne $summary[0]) {
            throw "SMOKE_RESULT must be the final output line."
          }

      - name: Verify failing assertion exits nonzero
        shell: pwsh
        run: |
          $output = @(& dotnet run --project .\tests\WallpaperField.SmokeTests\WallpaperField.SmokeTests.csproj --configuration Release --no-build --no-restore -- --verify-failure-exit 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -eq 0) {
            throw "The intentional failing assertion returned exit code 0."
          }
          Write-Host "Intentional failure returned expected nonzero exit code $exitCode."
          # GitHub appends an exit using LASTEXITCODE to built-in pwsh steps.
          exit 0

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $output = @(& dotnet list .\WallpaperField.slnx package --vulnerable --include-transitive --format json)
          $exitCode = $LASTEXITCODE
          $json = $output -join [Environment]::NewLine
          Write-Host $json
          if ($exitCode -ne 0) {
            throw "NuGet vulnerability audit exited with $exitCode."
          }
          $model = $json | ConvertFrom-Json
          $projects = @($model.projects)
          if ($projects.Count -eq 0) {
            throw "NuGet vulnerability JSON did not contain any projects."
          }
          $vulnerable = @()
          foreach ($project in $projects) {
            $frameworksProperty = $project.PSObject.Properties['frameworks']
            if ($null -eq $frameworksProperty) { continue }
            foreach ($framework in @($frameworksProperty.Value)) {
              foreach ($kind in @('topLevelPackages', 'transitivePackages')) {
                $property = $framework.PSObject.Properties[$kind]
                if ($null -eq $property) { continue }
                foreach ($package in @($property.Value)) {
                  $vulnerabilities = $package.PSObject.Properties['vulnerabilities']
                  if ($null -ne $vulnerabilities -and @($vulnerabilities.Value).Count -gt 0) {
                    $vulnerable += "$($project.path):$($package.id)@$($package.resolvedVersion)"
                  }
                }
              }
            }
          }
          if ($vulnerable.Count -gt 0) {
            throw "Known vulnerable packages: $($vulnerable -join ', ')"
          }

      - name: Audit deprecated NuGet packages
        shell: pwsh
        run: dotnet list .\WallpaperField.slnx package --deprecated --include-transitive

      - name: Report outdated NuGet packages
        shell: pwsh
        run: dotnet list .\WallpaperField.slnx package --outdated --include-transitive

      - name: Build and verify isolated release candidate
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP "WallpaperField-v1.2.1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          .\build-release.ps1 -OutputDirectory $releaseRoot
