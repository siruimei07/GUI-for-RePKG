name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\WallpaperField.slnx --configfile .\NuGet.Config

      - name: Build solution
        shell: pwsh
        run: dotnet build .\WallpaperField.slnx --configuration Release --no-restore

      - name: Enforce first-party warnings
        shell: pwsh
        run: |
          dotnet build .\WallpaperField.csproj --configuration Release --no-restore --no-dependencies -p:EnableNETAnalyzers=true -p:AnalysisMode=Recommended -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\WallpaperField.SmokeTests\WallpaperField.SmokeTests.csproj --configuration Release --no-restore --no-dependencies -p:EnableNETAnalyzers=true -p:AnalysisMode=Recommended -p:TreatWarningsAsErrors=true

      - name: Run and verify SmokeTests
        shell: pwsh
        run: |
          $output = @(& dotnet run --project .\tests\WallpaperField.SmokeTests\WallpaperField.SmokeTests.csproj --configuration Release --no-build --no-restore 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "SmokeTests exited with $exitCode."
          }

          $pattern = '^SMOKE_RESULT tests=([1-9][0-9]*) assertions=([1-9][0-9]*) passed=1 failed=0$'
          $summary = @($output | Where-Object { $_ -match $pattern })
          if ($summary.Count -ne 1) {
            throw "Expected exactly one valid SMOKE_RESULT line; found $($summary.Count)."
          }
          if ($output[-1] -ne $summary[0]) {
            throw "SMOKE_RESULT must be the final output line."
          }

      - name: Verify failing assertion exits nonzero
        shell: pwsh
        run: |
          $output = @(& dotnet run --project .\tests\WallpaperField.SmokeTests\WallpaperField.SmokeTests.csproj --configuration Release --no-build --no-restore -- --verify-failure-exit 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -eq 0) {
            throw "The intentional failing assertion returned exit code 0."
          }
          Write-Host "Intentional failure returned expected nonzero exit code $exitCode."
          # GitHub appends an exit using LASTEXITCODE to built-in pwsh steps.
          exit 0

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $output = @(& dotnet list .\WallpaperField.slnx package --vulnerable --include-transitive --format json)
          $exitCode = $LASTEXITCODE
          $json = $output -join [Environment]::NewLine
          Write-Host $json
          if ($exitCode -ne 0) {
            throw "NuGet vulnerability audit exited with $exitCode."
          }
          $model = $json | ConvertFrom-Json
          $projects = @($model.projects)
          if ($projects.Count -eq 0) {
            throw "NuGet vulnerability JSON did not contain any projects."
          }
          $vulnerable = @()
          foreach ($project in $projects) {
            $frameworksProperty = $project.PSObject.Properties['frameworks']
            if ($null -eq $frameworksProperty) { continue }
            foreach ($framework in @($frameworksProperty.Value)) {
              foreach ($kind in @('topLevelPackages', 'transitivePackages')) {
                $property = $framework.PSObject.Properties[$kind]
                if ($null -eq $property) { continue }
                foreach ($package in @($property.Value)) {
                  $vulnerabilities = $package.PSObject.Properties['vulnerabilities']
                  if ($null -ne $vulnerabilities -and @($vulnerabilities.Value).Count -gt 0) {
                    $vulnerable += "$($project.path):$($package.id)@$($package.resolvedVersion)"
                  }
                }
              }
            }
          }
          if ($vulnerable.Count -gt 0) {
            throw "Known vulnerable packages: $($vulnerable -join ', ')"
          }

      - name: Audit deprecated NuGet packages
        shell: pwsh
        run: dotnet list .\WallpaperField.slnx package --deprecated --include-transitive

      - name: Report outdated NuGet packages
        shell: pwsh
        run: dotnet list .\WallpaperField.slnx package --outdated --include-transitive

      - name: Verify release source and SDK item-boundary contracts
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP "WallpaperField-v1.3.0-source-contract-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          .\scripts\verify-release-source-cleanliness.ps1 -WorkRoot $probeRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify dirty clones cannot start a release
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP "WallpaperField-v1.3.0-dirty-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $probeRoot) {
            throw "Dirty release probe root already exists: $probeRoot"
          }
          [System.IO.Directory]::CreateDirectory($probeRoot) | Out-Null
          $pwsh = @(Get-Command pwsh -CommandType Application -ErrorAction Stop)[0].Source
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          function Invoke-DirtyReleaseProbe {
            param(
              [Parameter(Mandatory = $true)][string] $Name,
              [Parameter(Mandatory = $true)][string] $DirtyPath,
              [Parameter(Mandatory = $true)][ValidateSet('tracked', 'untracked')][string] $Mutation
            )

            $caseRoot = Join-Path $probeRoot $Name
            $repositoryPath = Join-Path $caseRoot 'repository'
            $toolsPath = Join-Path $caseRoot 'tools'
            $outputParent = Join-Path $caseRoot 'release-output'
            $outputPath = Join-Path $outputParent 'candidate'
            $dotnetMarker = Join-Path $caseRoot 'dotnet-called.txt'
            [System.IO.Directory]::CreateDirectory($caseRoot) | Out-Null
            [System.IO.Directory]::CreateDirectory($toolsPath) | Out-Null

            & git clone --quiet --no-hardlinks . $repositoryPath
            if ($LASTEXITCODE -ne 0) {
              throw "$Name clone failed with exit $LASTEXITCODE."
            }
            if ($Mutation -eq 'tracked') {
              [System.IO.File]::AppendAllText((Join-Path $repositoryPath $DirtyPath), "`r`nrelease dirty sentinel`r`n", $utf8NoBom)
            } else {
              [System.IO.File]::WriteAllText((Join-Path $repositoryPath $DirtyPath), "release dirty sentinel`r`n", $utf8NoBom)
            }

            $dotnetShim = @'
          @echo off
          >"%RELEASE_GATE_DOTNET_MARKER%" echo called %*
          exit /b 97
          '@
            [System.IO.File]::WriteAllText((Join-Path $toolsPath 'dotnet.cmd'), $dotnetShim, $utf8NoBom)

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $pwsh
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.CreateNoWindow = $true
            $startInfo.ArgumentList.Add('-NoLogo')
            $startInfo.ArgumentList.Add('-NoProfile')
            $startInfo.ArgumentList.Add('-NonInteractive')
            $startInfo.ArgumentList.Add('-File')
            $startInfo.ArgumentList.Add((Join-Path $repositoryPath 'build-release.ps1'))
            $startInfo.ArgumentList.Add('-OutputDirectory')
            $startInfo.ArgumentList.Add($outputPath)
            $startInfo.Environment['PATH'] = $toolsPath + [System.IO.Path]::PathSeparator + $startInfo.Environment['PATH']
            $startInfo.Environment['RELEASE_GATE_DOTNET_MARKER'] = $dotnetMarker

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw "$Name child process did not start."
            }
            $standardOutput = $process.StandardOutput.ReadToEnd()
            $standardError = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            $exitCode = $process.ExitCode
            $process.Dispose()
            $output = $standardOutput + [Environment]::NewLine + $standardError
            Write-Host "DIRTY_RELEASE_SENTINEL case=$Name exit=$exitCode"
            $output | Write-Host

            if ($exitCode -eq 0) { throw "$Name dirty release unexpectedly succeeded." }
            if ($output -notlike '*clean source worktree*') { throw "$Name clean-source diagnostic was absent." }
            if ($output -notlike "*$DirtyPath*") { throw "$Name dirty path was absent from the diagnostic." }
            if (Test-Path -LiteralPath $dotnetMarker) { throw "$Name invoked dotnet before rejection." }
            if (Test-Path -LiteralPath $outputParent) { throw "$Name created the release output parent before rejection." }
          }

          try {
            Invoke-DirtyReleaseProbe -Name 'tracked' -DirtyPath 'README.md' -Mutation tracked
            Invoke-DirtyReleaseProbe -Name 'untracked' -DirtyPath 'dirty-release-sentinel.txt' -Mutation untracked
          } finally {
            $resolvedProbeRoot = [System.IO.Path]::GetFullPath($probeRoot).TrimEnd('\', '/')
            $resolvedRunnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
            $expectedPrefix = $resolvedRunnerTemp + [System.IO.Path]::DirectorySeparatorChar
            $leaf = [System.IO.Path]::GetFileName($resolvedProbeRoot)
            if (-not $resolvedProbeRoot.StartsWith($expectedPrefix, [StringComparison]::OrdinalIgnoreCase) -or
                $leaf -notmatch '^WallpaperField-v1\.3\.0-dirty-[0-9]+-[0-9]+$') {
              throw "Refusing to remove an unverified dirty release probe root: $resolvedProbeRoot"
            }
            Remove-Item -LiteralPath $resolvedProbeRoot -Recurse -Force
          }
          # The two child failures are expected; do not leak their LASTEXITCODE to GitHub's pwsh wrapper.
          exit 0

      - name: Build and verify isolated release candidate
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP "WallpaperField-v1.3.0-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          .\build-release.ps1 -OutputDirectory $releaseRoot
